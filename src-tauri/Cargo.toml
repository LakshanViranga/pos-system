[package]
name = "restaurant-pos"
version = "1.0.0"
description = "Restaurant POS System"
authors = ["Your Name"]
edition = "2021"
rust-version = "1.60"

[lib]
name = "restaurant_pos_lib"
path = "src/lib.rs"

[[bin]]
name = "restaurant-pos"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
rusqlite = { version = "0.29", features = ["bundled"] }
chrono = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = "z"
